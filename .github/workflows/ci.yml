name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        working-directory: ./backend
        run: mvn verify -B

  frontend-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react/package-lock.json'
          
      - name: Install dependencies and build
        working-directory: ./frontend-react
        run: |
          npm ci || npm install
          npm run build

  frontend-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-angular/package-lock.json'
          
      - name: Install dependencies and build
        working-directory: ./frontend-angular
        run: |
          npm ci || npm install
          npm run build

  docker-build:
    needs: [backend, frontend-react, frontend-angular]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Docker Image
        run: docker build -t cms-backend ./backend
        
      - name: Build React Frontend Docker Image
        run: docker build -t cms-react ./frontend-react
        
      - name: Build Angular Frontend Docker Image
        run: docker build -t cms-angular ./frontend-angular
